name: Python CI

# Public-excerpt CI. The full suite needs modules that are not published (the database layer, the
# strategy registry, the orchestrator, runtime config), so this workflow runs the self-contained
# subset listed in .github/public-ci-tests.txt. That list is generated mechanically from the built
# public tree: test files that collect cleanly and pass in full under an empty environment.

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: python-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHONHASHSEED: "0"

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.lock

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.lock
          python -m pip install -e . --no-deps

      - name: Run the self-contained test subset
        run: python -m pytest -q --tb=short -p no:cacheprovider $(grep -v '^#' .github/public-ci-tests.txt)
