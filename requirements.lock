# mbappe environment lock — the venv that produces every verdict.
#
# WHY THIS FILE EXISTS: on 2026-07-19 two ad-hoc `pip install` commands silently REMOVED six
# packages (jsonschema, edgartools, financedatabase, exchange_calendars, import-linter,
# quantstats). `pip check` reported "No broken requirements found" the entire time, because
# nothing left in the venv declared them. It took four full-suite attempts to notice. A project
# that sha256-pins every ingest manifest and persists every MCPT null array had its
# verdict-producing environment as the one unpinned artifact.
#
# INSTALL:    .venv/Scripts/python -m pip install -r requirements.lock
# AFTER ANY ad-hoc install: REGENERATE this lock (`pip freeze`) and re-run the full suite.
# tests/test_environment_lock.py asserts the live venv matches this file and FAILS (never
# skips) on drift, printing the diff.
#
# ---- LOAD-BEARING PINS (see inline notes below) ----
#   edgartools        HARD PIN asserted verbatim by tests/research/test_edgar_setup.py.
#   Nasdaq-Data-Link  Sharadar SFA bulk-export client (research data).
#   pyarrow           Parquet engine for the Sharadar derived tables.
#   import-linter     Provides the `lint-imports` BINARY the import-contract guard shells to.
# -----------------------------------------------------------------------------------------
